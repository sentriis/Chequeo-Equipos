<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16325C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Chequeo diario</title>
<style>
:root{--navy:#16325C;--paper:#F4F5F7;--card:#fff;--ink:#1B1F27;--mute:#5B6573;--line:#D5D9E0;--ok:#1E7B46;--bad:#B3261E;--na:#5B6573;--sun:#F2B705}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 Roboto,"Segoe UI",system-ui,sans-serif}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--sun)}
header.top h1{font-size:18px;margin:0;font-weight:700;flex:1}
header.top small{display:block;font-weight:400;opacity:.8;font-size:12px}
header.top button{background:none;border:0;color:#fff;font-size:15px;padding:8px 4px}
main{padding:14px;max-width:720px;margin:0 auto}
h2{font-size:15px;margin:22px 0 8px;color:var(--navy)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--navy);border-radius:8px;padding:16px 12px;text-align:left;font:inherit;font-weight:700;color:var(--ink);min-height:74px}
.tile small{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:2px}
.tile:active{background:#E9EDF4}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:11px 10px;border:1px solid #AEB5C0;border-radius:6px;background:#fff;color:var(--ink)}
textarea{min-height:90px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.item.bad{border-color:var(--bad);background:#FDF3F2}
.item .t{font-weight:600;font-size:15px;margin-bottom:8px}
.seg{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:6px}
.seg button{font:inherit;font-weight:600;padding:12px 4px;border-radius:6px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.seg button[data-v=C].on{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[data-v=N].on{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button[data-v=A].on{background:var(--na);border-color:var(--na);color:#fff}
.item textarea{min-height:60px;margin-top:8px}
.prog{position:sticky;top:62px;z-index:4;background:var(--paper);padding:6px 0;font-size:13px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--navy);width:0}
.dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:6}
.btn{flex:1;font:inherit;font-weight:700;padding:14px 10px;border-radius:8px;border:2px solid var(--navy);background:#fff;color:var(--navy);text-align:center}
.btn.pri{background:var(--navy);color:#fff}
.btn.wa{background:#1E7B46;border-color:#1E7B46;color:#fff}
.btn.tg{background:#2A7AB8;border-color:#2A7AB8;color:#fff}
.btn.red{border-color:var(--bad);color:var(--bad)}
.stack{display:grid;gap:10px}
.sum{display:flex;gap:8px;margin:10px 0}
.sum div{flex:1;border-radius:8px;padding:10px;text-align:center;color:#fff;font-weight:700}
.sum small{display:block;font-weight:400;font-size:12px}
.alert{background:#FDF3F2;border:2px solid var(--bad);color:#7A1812;border-radius:8px;padding:10px;font-weight:600;margin:10px 0}
.hist{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;font:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;color:var(--ink)}
.hist small{color:var(--mute);display:block}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:12px;color:#fff;background:var(--ok);white-space:nowrap}
.tag.bad{background:var(--bad)}
.empty{color:var(--mute);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.chips{display:flex;gap:8px;margin:6px 0 10px}
.chip{flex:1;font:inherit;font-weight:600;padding:10px 6px;border-radius:20px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.login img{width:100%;max-width:260px;margin:0 auto 18px;display:block}
.login h1{font-size:20px;text-align:center;margin:0 0 16px;color:var(--navy)}
.who{font-size:13px;opacity:.85}
.user{display:flex;justify-content:space-between;align-items:center;gap:8px}
.user.off{opacity:.55}
.mini{font:inherit;font-size:13px;font-weight:600;padding:8px 10px;border-radius:6px;border:2px solid var(--navy);background:#fff;color:var(--navy)}
.tag.warn{background:var(--sun);color:#1B1F27}
.tag.grey{background:var(--na)}
.alertbtn{width:100%;font:inherit;font-weight:700;font-size:17px;padding:16px;border-radius:8px;border:0;background:var(--bad);color:#fff;margin-bottom:10px}
.gravs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gv{font:inherit;border:2px solid var(--line);background:#fff;border-radius:8px;padding:12px 4px;color:var(--ink);text-align:center}
.gv small{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.gv[data-v=C].on{background:var(--bad);border-color:var(--bad);color:#fff}
.gv[data-v=I].on{background:#C77700;border-color:#C77700;color:#fff}
.gv[data-v=M].on{background:var(--na);border-color:var(--na);color:#fff}
.gv.on small{color:#fff}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.th{position:relative;width:96px;height:96px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.th button{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:18px;line-height:1}
.pic{width:100%;border-radius:6px;border:1px solid var(--line);margin-bottom:8px}
.eq{background:#fff;border:1px solid var(--line);border-left:6px solid var(--navy);border-radius:8px;padding:10px 12px;margin:8px 0}
.eqh{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:2px}
.eq dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:14px}
.eq dt{color:var(--mute)}.eq dd{margin:0}
.note{background:#FFF8E1;border:1px solid var(--sun);color:#5B4300;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.tabs button{position:relative;font:inherit;font-size:12px;font-weight:600;background:none;border:0;border-top:3px solid transparent;color:var(--mute);padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.tabs button.on{color:var(--navy);border-top-color:var(--sun)}
.tabs svg{width:24px;height:24px}
.tabs .bd{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.cnt{margin:6px 0 8px;font-size:13px;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1B1F27;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),Math.max(2800,String(m).length*60))}
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const hm=d=>p2(d.getHours())+':'+p2(d.getMinutes());
const fd=s=>{if(!s)return '';const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s);return m?m[3]+'/'+m[2]+'/'+m[1]:s};
const itemsOf=T=>[...T.L.map((t,i)=>({k:'L'+i,t})),...T.R.map((t,i)=>({k:'R'+i,t}))];
const stats=r=>{const T=TYPES[r.type],it=itemsOf(T);let c=0,n=0,a=0;it.forEach(x=>{const v=(r.it[x.k]||{}).v;if(v==='C')c++;else if(v==='N')n++;else if(v==='A')a++});return{c,n,a,done:c+n+a,total:it.length}};

function obsText(r){const T=TYPES[r.type];const lines=[];if(r.opEstado==='ausente')lines.push('SIN '+opLbl(T).toUpperCase()+' PRESENTE (el motivo está en las observaciones).');itemsOf(T).forEach(x=>{const o=r.it[x.k]||{};if(o.v==='N')lines.push('NO CUMPLE - '+x.t+(o.note?': '+o.note:''))});if(r.obs&&r.obs.trim())lines.push(r.obs.trim());return lines.join('\n')}

async function api(action,data){
 const url=apiUrl();if(!url)throw{code:'nourl'};
 const ses=data&&data._ses||SES;
 const body=JSON.stringify(Object.assign({action,ci:ses.ci,pin:ses.pin},data||{},{_ses:undefined}));
 let res;try{res=await fetch(url,{method:'POST',body})}catch(e){throw{code:'red'}}
 let j;try{j=await res.json()}catch(e){throw{code:'resp'}}
 if(!j.ok){if(j.code==='auth'&&SES&&!(data&&data._ses)){SES=null;store.set('chq_ses',null);S.view='login';render()}throw j}
 return j;
}
function errMsg(e){
 if(e&&e.code==='accion')return 'El servidor de Google está desactualizado: falta publicar la "Nueva versión" de Codigo.gs (ver guía).';
 if(e&&e.msg)return e.msg;
 if(e&&e.code==='nourl')return 'Falta la dirección del servidor';
 if(e&&e.code==='red')return navigator.onLine===false?'Este teléfono no tiene internet':'No se pudo conectar con el servidor. Revisa que la dirección termine en /exec y que la implementación esté en "Cualquier persona". Usa "Probar conexión".';

const pendientes=()=>hist().filter(r=>r.sync===false&&r.realizadoCI===(SES&&SES.ci));
async function syncPending(silent){
 if(!SES||S.busy)return;
 const pend=pendientes();
 S.busy=true;
 try{
  if(pend.length){
   for(let k=0;k<pend.length;k+=4){
    const j=await api('sync',{records:pend.slice(k,k+4).map(r=>Object.assign({},r))});
    const h=hist();
    h.forEach(r=>{if(j.guardados.includes(String(r.id))){r.sync=true;const fid=j.fotos&&j.fotos[String(r.id)];if(fid){r.opFotoId=fid;r.opFoto=''}const fc=j.fotosCheq&&j.fotosCheq[String(r.id)];if(fc){r.fotoIds=fc;r.fotos=[]}}});   // las fotos ya están en el servidor: se libera espacio en el teléfono
    saveHist(h);
    if(j.rechazados.length&&!silent)toast(j.rechazados.length+' chequeo(s) no se aceptaron: '+j.rechazados[0].motivo);
   }
  }
  const l=await api('list',{since:store.get('chq_since',0)});
  let h=hist();const loc=new Map(h.map(r=>[String(r.id),r]));
  l.records.forEach(sr=>{const ex=loc.get(String(sr.id));if(ex&&ex.sync===false)return;sr.sync=true;loc.set(String(sr.id),sr)});
  saveHist([...loc.values()]);
  store.set('chq_since',Math.max(store.get('chq_since',0),...l.records.map(r=>r.srv||0)));
  try{await syncAlerts(silent)}catch(e){if(e&&e.code==='accion'){if(!S.warnOld){S.warnOld=1;toast(errMsg(e))}}else if(e&&e.code==='red')throw e;else if(!silent)toast(errMsg(e))}
  try{const e=await api('equipos');store.set('chq_equipos',e.equipos)}catch(_){}
  if(!silent)toast(pend.length?'Chequeos enviados y actualizados':'Todo actualizado');
 }catch(e){if(!silent)toast(errMsg(e))}
 finally{S.busy=false;if(S.view==='home')render(true)}
}

  if(q){const e=findEq(x.equipo);if(!(norm(x.equipo).includes(q)||(e&&e.tag&&norm(e.tag).includes(q))))return false}
  return true;

async function save(){

 if(s.done<s.total){toast('Faltan '+(s.total-s.done)+' puntos por marcar');const first=itemsOf(T).find(x=>!(r.it[x.k]||{}).v);const el=first&&document.querySelector('.item[data-k="'+first.k+'"]');el&&el.scrollIntoView({block:'center'});return}
 const miss=itemsOf(T).find(x=>{const o=r.it[x.k]||{};return o.v==='N'&&!(o.note||'').trim()});
 if(miss){toast('Escribe la falla en: '+miss.t);const el=document.querySelector('textarea[data-note="'+miss.k+'"]');el&&el.scrollIntoView({block:'center'});el&&el.focus();return}
 if(T.opReq&&!r.opEstado){toast('Falta la presencia del '+opLbl(T)+': toma la foto o indica que no hay');const c=$('#opcard');c&&c.scrollIntoView({block:'center'});return}
 if(r.opEstado==='foto'&&!r.opFoto&&!r.opFotoId){toast('Falta la foto del '+opLbl(T));return}
 if(r.opEstado==='ausente'&&(r.obs||'').trim().length<8){toast('Escribe en Observaciones por qué no hay '+opLbl(T)+' presente');const o=document.querySelector('[data-f=obs]');o&&o.scrollIntoView({block:'center'});o&&o.focus();return}
 if(!(await askPin('Confirma el chequeo con tu PIN')))return;
 r.confTs=Date.now();
 r.equipo=r.equipo.trim();
 store.set('last_sede',r.sede);store.set('last_patio',r.patio);r.sync=false;
 const h=hist().filter(x=>x.id!==r.id);h.unshift(r);if(!saveHist(h))return;
 S.tab='chq';S.view='result';render();toast('Chequeo guardado');
 syncPending(true).then(()=>{const x=hist().find(y=>y.id===r.id);if(x&&x.sync&&S.view==='result'&&S.rec&&S.rec.id===r.id){S.rec=x;toast('Enviado al servidor')}});
}

async function exportFile(r,kind){
 try{
  if(kind==='xlsx'&&!window.ExcelJS){toast('Falta cargar la librería de Excel. Conéctate a internet una vez.');return}
  if(kind==='pdf'&&!window.jspdf){toast('Falta cargar la librería de PDF. Conéctate a internet una vez.');return}
  toast('Preparando '+(kind==='xlsx'?'Excel':'PDF')+'...');
  const rr=await withFotos(await withOpFoto(r)),blob=kind==='xlsx'?await buildXlsx(rr):buildPdf(rr),name=fileBase(r)+'.'+kind;
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  download(blob,name);toast('Archivo descargado');
 }catch(err){console.error(err);toast('No se pudo crear el archivo')}
}

 y+=9.4;

const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function typeKeyStrict(t){const n=norm(t);if(!n)return null;if(n==='otro')return 'otro';for(const [k,T] of Object.entries(TYPES)){if(k===n||norm(T.name)===n||norm(T.sheet)===n)return k}return null}
const typeKeyOf=t=>typeKeyStrict(t)||'otro';
const findEq=id=>{const k=String(id||'').trim().toUpperCase();return k?store.get('chq_equipos',[]).find(e=>String(e.id).trim().toUpperCase()===k)||store.get('chq_equipos',[]).find(e=>e.tag&&String(e.tag).trim().toUpperCase()===k):null};
function eqCard(e){
 const kv=[['Marca / modelo',[e.marca,e.modelo].filter(Boolean).join(' ')],['Año',e.anio],['Serial',e.serial],['Placa',e.placa],['Capacidad',e.capacidad],['Sede / patio',[e.sede,e.patio].filter(Boolean).join(' / ')],['Color',e.color],['TAG',e.tag],['Observaciones',e.observaciones],['Agregado por',[e.alta_por,e.alta_fecha].filter(Boolean).join(' · ')]].filter(x=>x[1]);
 return `<div class="eq"><div class="eqh"><span><b>${esc(e.id)}</b> · ${esc(e.tipo)}</span>${e.estado?`<span class="tag ${e.estado==='Operativo'?'':e.estado==='En mantenimiento'?'warn':'bad'}">${esc(e.estado)}</span>`:''}</div>${e.descripcion?`<div>${esc(e.descripcion)}</div>`:''}${kv.length?`<dl>${kv.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`:''}</div>`;
}
function eqBox(id,ft,nf){
 if(!id||!String(id).trim()||!store.get('chq_equipos',[]).length)return '';
 const e=findEq(id);
 if(!e)return nf?'<div class="note">Este ID no está en el inventario. Revisa que esté bien escrito.</div>':'';
 let w='';
 if(ft&&typeKeyOf(e.tipo)!==ft)w+=`<div class="alert">En el inventario este ID es "${esc(e.tipo)}", pero este chequeo es de ${esc(TYPES[ft].name)}.</div>`;
 if(e.estado==='Fuera de servicio')w+='<div class="alert">Este equipo figura como FUERA DE SERVICIO en el inventario.</div>';
 return w+eqCard(e);
}

}

function getGeo(){
 if(GEO&&Date.now()-GEO.t<60000)return Promise.resolve(GEO);
 return new Promise(res=>{

  navigator.geolocation.getCurrentPosition(p=>{GEO={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),t:Date.now()};res(GEO)},()=>res(null),{enableHighAccuracy:true,timeout:8000,maximumAge:30000});
 });

const geoTxt=g=>g?'Lat '+Number(g.lat).toFixed(5)+'  Lon '+Number(g.lon).toFixed(5)+'  (±'+g.acc+' m)':'Ubicación no disponible';
// mk = {ts, geo, l2}: si viene, estampa fecha, hora y ubicación en la foto
function compress(file,mk){
 return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{
   const sc=Math.min(1,900/Math.max(im.width,im.height)),w=Math.round(im.width*sc),h=Math.round(im.height*sc),c=document.createElement('canvas');
   c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);URL.revokeObjectURL(url);
   if(mk){
    const fs=Math.max(12,Math.round(w/34)),lines=[fdt(mk.ts),geoTxt(mk.geo)];if(mk.l2)lines.push(mk.l2);
    const bh=Math.round(fs*1.35*lines.length+fs*.6);
    x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,h-bh,w,bh);
    x.fillStyle='#fff';x.font='bold '+fs+'px Arial, sans-serif';x.textBaseline='top';
    lines.forEach((tx,k)=>x.fillText(tx,Math.round(fs*.5),h-bh+Math.round(fs*.3)+Math.round(k*fs*1.35),w-fs));
   }
   res({d:c.toDataURL('image/jpeg',.6),w,h});
  };
  im.onerror=()=>rej(new Error('img'));im.src=url;
 });
}

 };

  const r=await fetch(url),tx=await r.text();
  if(/Servidor de chequeos activo/.test(tx)){
   const v=(/version (\S+)/.exec(tx)||[])[1];
   if(v===SERVER_VERSION)alert('Conexión correcta: el servidor responde y está actualizado.\nAhora escribe tu cédula y PIN.');
   else alert('El servidor responde, pero está DESACTUALIZADO'+(v?' (versión '+v+')':'')+'.\n\nEn Apps Script pega el Codigo.gs nuevo y publica: Implementar > Gestionar implementaciones > lápiz > Versión: Nueva versión > Implementar.');
  }
  else alert('La dirección responde, pero no es el servidor de chequeos.\nRevisa que sea la de tu implementación.');
 }catch(e){
  alert(navigator.onLine===false?'Este teléfono no tiene internet.':'No se pudo conectar con el servidor.\n\n1) La dirección debe terminar en /exec.\n2) En Apps Script: Implementar > Gestionar implementaciones > "Quién tiene acceso" = Cualquier persona.\n3) Si cambiaste el código, publica una Nueva versión.');
 }
}
async function doLogin(){
 const urlEl=$('#lUrl');
 if(urlEl){const u=urlEl.value.trim();if(u&&!/\/exec$/.test(u)){toast('La dirección del servidor debe terminar en /exec');return}store.set('api_url',u)}
 const ci=$('#lCi').value.trim(),pin=$('#lPin').value.trim();
 if(!ci||!pin){toast('Escribe tu cédula y tu PIN');return}
 toast('Entrando...');
 try{
  const j=await api('login',{_ses:{ci,pin}});
  if(store.get('chq_lastci','')!==j.user.ci){['chq_since','chq_asince'].forEach(k=>store.set(k,0));store.set('chq_aseen',[]);store.set('chq_ainit',false);store.set('chq_lastci',j.user.ci)}
  SES={ci:j.user.ci,pin,nombre:j.user.nombre,rol:j.user.rol};store.set('chq_ses',SES);store.set('chq_equipos',j.equipos||[]);
  if(j.version!==SERVER_VERSION)setTimeout(()=>alert('El servidor de Google está desactualizado'+(j.version?' (versión '+j.version+')':'')+'.\nAlgunas funciones nuevas (alertas, inventario) no van a funcionar.\n\nSolución: en Apps Script pega el Codigo.gs nuevo y publica una "Nueva versión" en Implementar > Gestionar implementaciones.'),400);
  S.view='home';S.tab='chq';S.filtro=esSup()?'pend':'all';render();syncPending(true);startPoll();
  try{if(esSup()&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(()=>render(true))}catch(_){}
 }catch(e){toast(errMsg(e))}
}
async function savePin(){
 const a=$('#nPin').value.trim(),b=$('#nPin2').value.trim();
 if(!/^\d{4,6}$/.test(a)){toast('El PIN debe tener de 4 a 6 números');return}
 if(a!==b){toast('Los dos PIN no son iguales');return}
 try{await api('changePin',{newPin:a});SES.pin=a;store.set('chq_ses',SES);toast('PIN cambiado');S.view='home';render()}catch(e){toast(errMsg(e))}
}
async function addUser(){
 const d={unombre:$('#uNom').value.trim(),uci:$('#uCi').value.trim(),upin:$('#uPin').value.trim(),urol:$('#uRol').value,ucorreo:$('#uMail').value.trim()};
 if(!d.unombre||!d.uci||!d.upin){toast('Completa nombre, cédula y PIN');return}
 try{S.users=(await api('addUser',d)).users;toast('Usuario agregado');render()}catch(e){toast(errMsg(e))}
}
async function userOpts(ci){
 const u=S.users.find(x=>x.ci===ci);if(!u)return;
 const op=prompt(u.nombre+'\n\n1 = Poner PIN nuevo\n2 = Cambiar a Técnico\n3 = Cambiar a Supervisor\n4 = Cambiar a Jefe de departamento\n5 = Cambiar a Administrador\n6 = '+(u.activo?'Desactivar':'Activar')+' usuario\n7 = Poner o cambiar correo\n\nEscribe el número:');
 let d=null;
 if(op==='1'){const pn=prompt('PIN nuevo (4 a 6 números):');if(!pn)return;d={upin:pn.trim()}}
 else if(op==='2')d={urol:'tecnico'};else if(op==='3')d={urol:'supervisor'};else if(op==='4')d={urol:'jefe'};else if(op==='5')d={urol:'admin'};
 else if(op==='6')d={uactivo:!u.activo};
 else if(op==='7'){const c=prompt('Correo (déjalo vacío para quitarlo):');if(c===null)return;d={ucorreo:c.trim()}}
 if(!d)return;
 try{S.users=(await api('setUser',Object.assign({uci:ci},d))).users;toast('Cambio guardado');render()}catch(e){toast(errMsg(e))}
}

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
if(SES){syncPending(true);startPoll()}
</script>
